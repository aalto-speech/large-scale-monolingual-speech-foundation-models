common:
  fp16: false
  log_format: json
  log_interval: 100

checkpoint:
  save_interval_updates: 2500
  keep_interval_updates: 1
  no_epoch_checkpoints: true
  keep_best_checkpoints: 3
  load_checkpoint_on_all_dp_ranks: true

task:
  _name: audio_pretraining
  binarized_dataset: True
  max_sample_size: 960000
  min_sample_size: 32000
  normalize: true

dataset:
  validate_interval: 2500
  skip_invalid_size_inputs_valid_test: true
  valid_subset: valid_FULL

distributed_training:
  ddp_backend: legacy_ddp

criterion:
  _name: wav2vec
  infonce: true
  log_keys: ["prob_perplexity","code_perplexity","temp"]
  loss_weights: [0.1, 0]

optimization:
  max_update: 400000
  update_freq: [1]
  lr: [0.0001]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: polynomial_decay
  warmup_updates: 12500

model:
  _name: wav2vec2
  quantize_targets: true
  extractor_mode: layer_norm
  layer_norm_first: true
  final_dim: 576
  latent_temp: [2.0,0.1,0.999995]
  encoder_layerdrop: 0.00
  dropout_input: 0.0
  dropout_features: 0.0
  dropout: 0.0
  attention_dropout: 0.0
  conv_bias: true

  encoder_layers: 48
  encoder_embed_dim: 1024
  encoder_ffn_embed_dim: 2048
  encoder_attention_heads: 16

  feature_grad_mult: 1.0

  csgu_linear_units: 2608

  activation_fn: gelu

  layer_type: ebranchformer
  attn_type: espnet
  pos_enc_type: rel_pos
